apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-whoami
  labels:
    app: whoami
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    app: whoami